das que começam com maiúscula (nomes próprios)<\/label>\n    <label class=\"ck\"><input type=\"checkbox\" id=\"optColq\" checked> Avisar sobre linguagem muito coloquial (né, pra, tá…)<\/label>\n  <\/div>\n  <div class=\"row\" style=\"margin:12px 0 4px\">\n    <label class=\"sl\">Perfil <select id=\"perfil\"><option value=\"17,0\">Legenda comum, adulto (17 car./s)<\/option><option value=\"13,0\">Legenda comum, infantil (13 car./s)<\/option><option value=\"20,1\">SDH, adulto (20 car./s)<\/option><option value=\"17,1\">SDH, infantil (17 car./s)<\/option><\/select><\/label>\n    <label class=\"sl\">Quadros/s <select id=\"fps\"><option value=\"24\">24 (23,976)<\/option><option value=\"25\">25<\/option><option value=\"30\">30 (29,97)<\/option><\/select><\/label>\n    <button id=\"go\" disabled style=\"margin-left:8px\">Revisar legenda<\/button>\n  <\/div>\n  <div id=\"status\"><\/div>\n<\/div>\n\n<div id=\"out\" hidden>\n  <div class=\"box\">\n    <div id=\"sum\"><\/div>\n    <div class=\"bar\" id=\"bar\"><\/div>\n    <div class=\"chips\" id=\"chips\"><\/div>\n    <div class=\"row\" style=\"margin-top:10px\">\n      <button class=\"sec sm\" id=\"dlRep\">Baixar relatório (.txt)<\/button>\n      <button class=\"sec sm\" id=\"undo\" disabled>↩ Desfazer<\/button>\n      <button class=\"sec sm\" id=\"dlFix\">Baixar legenda com minhas alterações<\/button>\n      <button class=\"sec sm\" id=\"dlSrt\" hidden>Baixar como .srt<\/button>\n    <\/div>\n    <div style=\"color:var(--mut);font-size:.85rem;margin-top:8px\">Para cada apontamento você decide: aplicar a sugestão (quando houver), ignorar o tipo ou editar o texto da legenda à mão. A legenda baixada reflete só o que você aplicou.<\/div>\n    <details id=\"igd\" hidden><summary id=\"igs\"><\/summary><div id=\"igl\"><\/div><\/details>\n  <\/div>\n  <div id=\"list\"><\/div>\n<\/div>\n<\/div>\n<div id=\"tabCmp\" hidden>\n  <div class=\"box\">\n    <div class=\"row2\">\n      <div class=\"dz\" id=\"dzT\"><b>Template (opcional)<\/b><span id=\"nT\">legenda no idioma original, ex.: inglês<\/span><\/div>\n      <div class=\"dz\" id=\"dzP\"><b>Legenda em português<\/b><span id=\"nP\">obrigatória<\/span><\/div>\n    <\/div>\n    <input type=\"file\" id=\"fT\" hidden accept=\".srt,.dfxp,.pxtt,.ttml,.xml,.ttal,.json,.txt\"><input type=\"file\" id=\"fP\" hidden accept=\".srt,.dfxp,.pxtt,.ttml,.xml,.ttal,.json,.txt\">\n    <div class=\"aibox\">\n      <div class=\"row aiR1\">\n        <label class=\"sl\">Serviço de IA <select id=\"aiProv\">\n          <option value=\"gemini\">Gemini (Google) · plano gratuito<\/option>\n          <option value=\"groq\">Groq · plano gratuito<\/option>\n          <option value=\"openrouter\">OpenRouter · modelos gratuitos<\/option>\n          <option value=\"anthropic\">Claude (Anthropic)<\/option>\n          <option value=\"openai\">ChatGPT (OpenAI)<\/option>\n          <option value=\"custom\">Outro compatível com OpenAI (Ollama, Mistral, DeepSeek…)<\/option>\n        <\/select><\/label>\n        <input class=\"tx\" type=\"password\" id=\"aiKey\" placeholder=\"Chave da API\">\n        <input class=\"tx\" id=\"aiModel\" list=\"aiModels\" placeholder=\"Modelo\"><datalist id=\"aiModels\"><\/datalist>\n        <button class=\"sec\" id=\"aiList\" type=\"button\">Buscar modelos<\/button>\n      <\/div>\n      <div class=\"row\" id=\"aiBaseRow\" style=\"margin-top:8px\" hidden><input class=\"tx\" id=\"aiBase\" size=\"44\" placeholder=\"Endereço base (ex.: http://localhost:11434/v1)\"><\/div>\n      <div class=\"nota\" id=\"aiNote\"><\/div>\n      <div class=\"row aiR2\"><span class=\"sl\">Preço por 1 milhão de tokens (US$):<\/span>\n        <input class=\"tx\" type=\"number\" step=\"any\" min=\"0\" id=\"aiPin\" placeholder=\"entrada\">\n        <input class=\"tx\" type=\"number\" step=\"any\" min=\"0\" id=\"aiPout\" placeholder=\"saída\">\n        <label class=\"sl\">CPS máximo <input class=\"tx\" type=\"number\" id=\"cmpCps\" value=\"17\" step=\"any\" min=\"1\"><\/label>\n        <label class=\"ck\" style=\"margin:0\"><input type=\"checkbox\" id=\"aiMem\"> Lembrar a chave<\/label><\/div>\n      <p style=\"color:var(--mut);font-size:.85rem;margin:8px 0 0\">Os textos das legendas são enviados ao serviço escolhido. A chave fica só na memória desta página, a menos que você marque “lembrar”.<\/p>\n    <\/div>\n    <div class=\"row\" style=\"margin-top:12px\"><label class=\"sl\">Nível de detecção <select id=\"aiNivel\"><option value=\"1\">Leve — só erros claros<\/option><option value=\"2\" selected>Médio — erros e dúvidas prováveis<\/option><option value=\"3\">Pesado — inclui nuances e pequenas melhorias<\/option><\/select><\/label><button id=\"cmpGo\" disabled>Comparar com IA<\/button><button class=\"sec\" id=\"cmpStop\" hidden>Parar<\/button><\/div>\n    <div id=\"cmpStatus\" style=\"color:var(--mut);margin:8px 0\"><\/div>\n    <div id=\"cmpUso\" class=\"uso\"><\/div>\n  <\/div>\n  <div id=\"cmpOut\" hidden>\n    <div class=\"box\">\n      <div id=\"cmpSum\" style=\"font-weight:600\"><\/div>\n      <div class=\"bar\" id=\"cmpBar\"><\/div>\n      <div class=\"chips\" id=\"cmpChips\"><\/div>\n      <div class=\"row\"><button class=\"sec sm\" id=\"cmpRep\">Baixar relatório (.txt)<\/button><\/div>\n    <\/div>\n    <div id=\"cmpList\"><\/div>\n  <\/div>\n<\/div>\n<\/main>\n\n<script>\nconst MAX_CHARS=42, MAX_LINHAS=2, DUR_MAX=7;\nconst TAG=/<\\/?[a-zA-Z][^>]*>|\\{\\\\[^}]*\\}/g;\nlet cues=[], erros=[], nomeArq=\"legenda\", lastRep=\"\";\nconst $=id=>document.getElementById(id);\n\n// ---------- arquivo ----------\nconst drop=$(\"drop\"), inp=$(\"file\");\ndrop.onclick=()=>inp.click();\ndrop.ondragover=e=>{e.preventDefault();drop.classList.add(\"over\")};\ndrop.ondragleave=()=>drop.classList.remove(\"over\");\ndrop.ondrop=e=>{e.preventDefault();drop.classList.remove(\"over\");if(e.dataTransfer.files[0])carregar(e.dataTransfer.files[0])};\ninp.onchange=()=>{if(inp.files[0])carregar(inp.files[0])};\nlet bruto=\"\";\nfunction carregar(f){\n  nomeArq=f.name.replace(/\\.[^.]+$/,\"\");extArq=(f.name.match(/\\.([^.]+)$/)||[,\"srt\"])[1].toLowerCase();ign={};hist=[];editando=null;filtro.clear();$(\"out\").hidden=true;\n  $(\"fname\").textContent=f.name;\n  f.arrayBuffer().then(buf=>{\n    try{bruto=new TextDecoder(\"utf-8\",{fatal:true}).decode(buf)}\n    catch(e){bruto=new TextDecoder(\"windows-1252\").decode(buf)}\n    const r=abrir();\n    if(arq.fps)$(\"fps\").value=arq.fps>=29?\"30\":arq.fps>=24.5?\"25\":\"24\";\n    const nome=arq.tipo===\"ttml\"?extArq.toUpperCase():arq.nome;\n    atualizaBotoes();\n    $(\"fname\").textContent=f.name+` · ${nome}, ${cues.length} legendas`+(arq.fps?`, ${Math.round(arq.fps*1000)/1000} quadros/s`:\"\");\n    $(\"go\").disabled=!cues.length;\n    $(\"status\").textContent=cues.length?\"Arquivo carregado. Clique em “Revisar legenda”.\":(r.erros[0]||\"Não encontrei nenhuma legenda válida nesse arquivo.\");\n  });\n}\n\n// ---------- leitura do SRT ----------\nconst TEMPO=/(\\d{1,2}):(\\d{2}):(\\d{2})[,.](\\d{1,3})\\s*-->\\s*(\\d{1,2}):(\\d{2}):(\\d{2})[,.](\\d{1,3})/;\nconst sec=(h,m,s,ms)=>+h*3600+ +m*60+ +s+ +ms.padEnd(3,\"0\")/1000;\nfunction fmt(t){let ms=Math.round(t*1000);const h=Math.floor(ms/3600000);ms%=3600000;const m=Math.floor(ms/60000);ms%=60000;const s=Math.floor(ms/1000);ms%=1000;\n  return [h,m,s].map(x=>String(x).padStart(2,\"0\")).join(\":\")+\",\"+String(ms).padStart(3,\"0\")}\nfunction lerSrt(txt){\n  txt=txt.replace(/^\\uFEFF/,\"\").replace(/\\r\\n?/g,\"\\n\").trim();\n  const res=[],err=[];\n  txt.split(/\\n\\s*\\n/).forEach((b,i)=>{\n    const L=b.split(\"\\n\");\n    if(L.length<2){err.push(`Bloco ${i+1}: formato inválido (muito curto).`);return}\n    let num=parseInt(L[0]),k=1;if(isNaN(num)||!/^\\s*\\d+\\s*$/.test(L[0])){num=i+1;k=0}\n    const m=TEMPO.exec(L[k]);\n    if(!m){err.push(`Bloco ${i+1}: linha de tempo inválida: “${L[k]}”`);return}\n    res.push({num,ini:sec(...m.slice(1,5)),fim:sec(...m.slice(5,9)),linhas:L.slice(k+1),p:[],lt:[]});\n  });\n  return [res,err];\n}\nconst limpo=c=>c.linhas.join(\"\\n\").replace(TAG,\"\");\n\n// ---------- formatos de legenda (SRT, TTML/DFXP/PXTT, TTAL) ----------\nlet arq={tipo:\"srt\"},modoT=\"ms\",nomT=24,extArq=\"srt\",limite=150;\nconst ENT={amp:\"&\",lt:\"<\",gt:\">\",quot:'\"',apos:\"'\",nbsp:\"\\u00a0\"};\nconst decEnt=s=>s.replace(/&(#x[0-9a-f]+|#\\d+|\\w+);/gi,(m,e)=>{\n  if(e[0]===\"#\"){const n=e[1].toLowerCase()===\"x\"?parseInt(e.slice(2),16):parseInt(e.slice(1),10);return String.fromCodePoint(n)}\n  return ENT[e]!==undefined?ENT[e]:m});\nconst encEnt=s=>s.replace(/&/g,\"&amp;\").replace(/<\/g,\"&lt;\").replace(/>/g,\"&gt;\");\nconst pad=(n,l=2)=>String(n).padStart(l,\"0\");\nfunction fmtTC(sec){const tot=Math.round(sec*nomT),s=Math.floor(tot/nomT),f=tot-s*nomT;\n  return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}:${pad(f)}`}\nconst fmtT=sec=>modoT===\"tc\"?fmtTC(sec):fmt(sec);\nfunction finalizar(cues){cues.forEach(c=>{c.orig=c.linhas.join(\"\\n\");c.fim0=c.fim});return cues}\n\n// TTAL (JSON): estilos em intervalos de caracteres <-> tags <i>\nfunction aTags(txt,styles){\n  const R=styles.filter(s=>s.type===\"italic\").sort((a,b)=>a.from-b.from);let o=\"\",pos=0;\n  for(const r of R){if(r.from<pos||r.to<=r.from)continue;o+=txt.slice(pos,r.from)+\"<i>\"+txt.slice(r.from,r.to)+\"<\/i>\";pos=r.to}\n  return o+txt.slice(pos);\n}\nfunction deTags(t){\n  let plain=\"\",styles=[],ab=-1;\n  for(const m of t.matchAll(/<\\/?i>|<[^>]*>|[^<]+|<\/gi)){\n    const s=m[0].toLowerCase();\n    if(s===\"<i>\"){if(ab<0)ab=plain.length}\n    else if(s===\"<\/i>\"){if(ab>=0){if(plain.length>ab)styles.push({from:ab,to:plain.length,type:\"italic\"});ab=-1}}\n    else if(s[0]===\"<\"&&s.length>1){}\n    else plain+=m[0];\n  }\n  if(ab>=0&&plain.length>ab)styles.push({from:ab,to:plain.length,type:\"italic\"});\n  return{txt:plain,styles};\n}\nfunction lerTTAL(t){\n  let d;try{d=JSON.parse(t)}catch(e){return{cues:[],erros:[\"Arquivo TTAL inválido: \"+e.messag CMP.cortes=0;\n  const nv=+$(\"aiNivel\").value||2;\n  const sysES=`Eres revisor sénior de subtítulos en español neutro latinoamericano (estándar Netflix es-419). Recibirás una lista JSON de subtítulos {id, pt${TT?\", en (original)\":\"\"}} (el campo \"pt\" contiene el texto en español). ${TT?\"Compara el español con el original, incluido el uso de cursiva (<i><\/i>). \":\"No hay original: evalúa solo el español. \"}Responde SOLO con un array JSON de objetos {\"id\":number,\"tipo\":\"clave del tipo\",\"rotulo\":\"detalle corto opcional\",\"gravidade\":1|2|3,\"mensagem\":\"explicación breve en español\",\"sugestao\":\"texto completo sugerido para el subtítulo\"}. En \"gravidade\": 3 = grave o claro, 2 = probable o molesto, 1 = detalle o preferencia.\nClasifica cada observación por el TIPO de problema, eligiendo exactamente una de estas claves para \"tipo\":\n${TIPOS.filter(t=>t[0]!==\"caixa\").map(t=>`- \"${t[0]}\" (${t[2]}): ${t[4]}`).join(\"\\n\")}\n${NIVEIS[nv][1]}\nUsa \"rotulo\" (hasta 3 palabras) solo para detallar el subtipo (p. ej.: \"falso cognado\") o, cuando \"tipo\" sea \"outro\", para describir el problema. No clasifiques como objetivo o subjetivo: indica solo el tipo.\n\"sugestao\" = texto completo corregido o mejorado del subtítulo; inclúyelo siempre que haya una corrección o mejora concreta, y SIEMPRE en los tipos \"naturalidade\" y \"concisao\". Esos dos tipos solo deben aparecer cuando la mejora sea realmente buena, respetando la frecuencia indicada en el nivel de detección.\nEl español debe ser neutro latinoamericano: tú/usted y ustedes (nunca vos ni vosotros), sin modismos de un país concreto. En \"sugestao\" mantén \\\\n entre líneas y <i><\/i> cuando lo haya, como máximo 2 líneas de hasta 42 caracteres. Ignora espacios, puntuación y mayúsculas triviales (otra herramienta se encarga). Los tiempos pueden diferir un poco entre original y traducción (subtítulos unidos o divididos): considera el conjunto. No inventes problemas: si el subtítulo está bien, no lo incluyas. Nada más que el JSON.`;\n  const sysPT=`Você é revisor sênior de legendas em português do Brasil (padrão Netflix pt-BR). Receberá uma lista JSON de legendas {id, pt${TT?\", en (original)\":\"\"}}. ${TT?\"Compare o português com o original, inclusive o uso de itálico (<i><\/i>). \":\"Não há original: avalie só o português. \"}Responda SOMENTE com um array JSON de objetos {\"id\":number,\"tipo\":\"chave do tipo\",\"rotulo\":\"detalhe curto opcional\",\"gravidade\":1|2|3,\"mensagem\":\"explicação curta em português\",\"sugestao\":\"texto completo sugerido para a legenda pt\"}. Em \"gravidade\": 3 = grave ou claro, 2 = provável ou incômodo, 1 = detalhe ou preferência.\nClassifique cada apontamento pelo TIPO de problema, escolhendo exatamente uma destas chaves para \"tipo\":\n${TIPOS.filter(t=>t[0]!==\"caixa\").map(t=>`- \"${t[0]}\" (${t[1]}): ${t[3]}`).join(\"\\n\")}\n${NIVEIS[nv][0]}\nUse \"rotulo\" (até 3 palavras) só para detalhar o subtipo (ex.: \"falso cognato\") ou, quando \"tipo\" for \"outro\", para descrever o problema. Não classifique como objetivo ou subjetivo: indique apenas o tipo.\n\"sugestao\" = texto completo corrigido ou melhorado da legenda; inclua sempre que houver uma correção ou melhoria concreta, e SEMPRE nos tipos \"naturalidade\" e \"concisao\". Esses dois tipos só devem aparecer quando a melhoria for realmente boa, respeitando a frequência indicada no nível de detecção.\nNa \"sugestao\" mantenha \\\\n entre linhas e <i><\/i> quando houver, no máximo 2 linhas de até 42 caracteres. Ignore espaços, pontuação e maiúsculas triviais (outra ferramenta cuida). Os tempos podem diferir um pouco entre original e tradução (legendas juntadas ou divididas): considere o conjunto. Não invente problemas: se a legenda está boa, não a liste. Nada além do JSON.`;\n  const sys=LG===\"es\"?sysES:sysPT;\n  let falhas=0;\n  for(let k=0;k<N&&!CMP.parar;k+=LOTE){\n    $(\"cmpStatus\").textContent=T(`IA analisando legendas ${k+1}–${Math.min(k+LOTE,N)} function ajusta(f){
  try{
    const d=f.contentDocument;if(!d||!d.documentElement||f.hidden)return;
    f.style.height=Math.ceil(d.documentElement.getBoundingClientRect().height)+"px";
  }catch(e){f.style.height="85vh";f.scrolling="yes"}
}
function monta(l){
  if(frames[l])return frames[l];
  const f=document.createElement("iframe");f.className="app";f.allow="clipboard-write";f.title=INFO[l].t;f.scrolling="no";
  f.setAttribute("allow","clipboard-write");f.hidden=true;
  f.addEventListener("load",()=>{
    try{const d=f.contentDocument,W=d.defaultView;ajusta(f);
      new W.ResizeObserver(()=>ajusta(f)).observe(d.documentElement)}catch(e){ajusta(f)}
  });
  f.srcdoc=DOCS[l];hosts.appendChild(f);frames[l]=f;return f;
}
function mostra(l){
  monta(l);
  for(const k in frames)frames[k].hidden=k!==l;
  document.querySelectorAll(".lgb").forEach(b=>{const on=b.dataset.l===l;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on?"true":"false")});
  document.getElementById("tag").textContent=INFO[l].tag;document.documentElement.lang=INFO[l].lang;
  try{localStorage.setItem("revtitles_tab",l)}catch(e){}
  ajusta(frames[l]);
}
document.querySelectorAll(".lgb").forEach(b=>b.onclick=()=>mostra(b.dataset.l));
let ini="pt";try{if(localStorage.getItem("revtitles_tab")==="es")ini="es"}catch(e){}
mostra(ini);

</script>
</body>
</html>
